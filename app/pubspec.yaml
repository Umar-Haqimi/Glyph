name: glyph
description: "Glyph: on-device Stockfish game review for Android, with LLM-written move explanations."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  glyph_core:
    path: ../packages/glyph_core
  # Use material_ui, NOT package:flutter/material.dart (docs/m0/libraries.md section 4).
  material_ui: ^1.10.0
  dynamic_color: ^2.1.0
  flutter_riverpod: ^3.4.3
  sqlite3: ^3.8.0
  file_picker: ^13.3.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/openings.tsv
