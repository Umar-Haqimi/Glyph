name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Keep in sync with .fvmrc.
  FLUTTER_VERSION: 3.47.9

jobs:
  core:
    name: glyph_core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        working-directory: packages/glyph_core
        run: dart analyze
      - name: Test
        working-directory: packages/glyph_core
        run: dart test

  app:
    name: app (analyze, widget tests, release build, checks)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Banned dependencies
        run: tool/check_banned_deps.sh
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Widget tests
        working-directory: app
        run: flutter test
      - name: Release build (split per ABI)
        working-directory: app
        run: flutter build apk --release --split-per-abi
      - name: Permission check
        run: |
          export APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          [ -x "$APKANALYZER" ] || APKANALYZER="$(find "$ANDROID_HOME" -name apkanalyzer -type f | head -n1)"
          export APKANALYZER
          tool/check_permissions.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glyph-release-apks
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
