name: Release

# Runs only for version tags (v0.1.0, ...). Needs the repository secrets listed in docs/RELEASE.md:
# GLYPH_KEYSTORE_BASE64, GLYPH_KEYSTORE_PASSWORD, GLYPH_KEY_ALIAS, GLYPH_KEY_PASSWORD.
# Third-party actions are pinned to full commit SHAs (version in the comment).
on:
  push:
    tags:
      - 'v*'

env:
  # Keep in sync with .fvmrc.
  FLUTTER_VERSION: 3.47.9

permissions:
  contents: read

jobs:
  build:
    name: Test, build and sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Tag must match app/pubspec.yaml
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pub_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml | head -n1)"
          echo "tag: $tag_version, app/pubspec.yaml: $pub_version"
          test -n "$pub_version" && test "$tag_version" = "$pub_version" || { echo "tag $GITHUB_REF_NAME does not match app/pubspec.yaml version $pub_version" >&2; exit 1; }
          echo "GLYPH_VERSION=$tag_version" >> "$GITHUB_ENV"
      - name: Release notes from this version's CHANGELOG section
        run: |
          awk -v v="$GLYPH_VERSION" '
            /^## \[/ { if (on) exit; on = (index($0, "## [" v "]") == 1); next }
            on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "no CHANGELOG.md section '## [$GLYPH_VERSION]'" >&2; exit 1; }
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Core tests
        working-directory: packages/glyph_core
        run: dart analyze && dart test
      - name: App analyze and tests
        working-directory: app
        run: flutter analyze && flutter test
      - name: Restore keystore
        env:
          GLYPH_KEYSTORE_BASE64: ${{ secrets.GLYPH_KEYSTORE_BASE64 }}
        run: |
          test -n "$GLYPH_KEYSTORE_BASE64" || { echo "GLYPH_KEYSTORE_BASE64 secret is missing" >&2; exit 1; }
          echo "$GLYPH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glyph-release.jks"
          echo "GLYPH_KEYSTORE_FILE=$RUNNER_TEMP/glyph-release.jks" >> "$GITHUB_ENV"
      - name: Signed release build and checks
        env:
          GLYPH_KEYSTORE_PASSWORD: ${{ secrets.GLYPH_KEYSTORE_PASSWORD }}
          GLYPH_KEY_ALIAS: ${{ secrets.GLYPH_KEY_ALIAS }}
          GLYPH_KEY_PASSWORD: ${{ secrets.GLYPH_KEY_PASSWORD }}
        run: |
          export APKANALYZER="$(find "$ANDROID_HOME" -name apkanalyzer -type f | head -n1)"
          bash tool/build_release.sh
      - name: Collect APKs, checksums and notes
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/app/outputs/flutter-apk/app-*-release.apk "$RUNNER_TEMP/dist/"
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/dist/notes.md"
          cd "$RUNNER_TEMP/dist"
          sha256sum app-*-release.apk > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glyph-release
          path: |
            ${{ runner.temp }}/dist/app-*-release.apk
            ${{ runner.temp }}/dist/SHA256SUMS
            ${{ runner.temp }}/dist/notes.md
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: glyph-release
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" app-*-release.apk SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Glyph $GITHUB_REF_NAME" --notes-file notes.md --draft
